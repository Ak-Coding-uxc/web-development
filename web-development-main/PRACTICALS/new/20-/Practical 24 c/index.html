


<html></html>
<head>
    <title>Practical 24

    </title>
    <style>
        *{
            border: 2px solid green;
            margin: 12px;
            padding: 3px;
        }

        #main{
            color: brown;
            font-size: 34px;
        }

        .first{
            color: rgb(4, 244, 4);
            background-color: burlywood;
            font-size: 17px;
            letter-spacing: 4px;
        }

        .second , #third{
           color: red;
            background-color: lightblue;
            font-size: 23px; 
        }

        .h , #box{
           color: pink;
            background-color: purple;
            font-size: 12px; 
        }
        
    </style>
</head>
<body>
    <h1 id="main">Heading 1</h1>
    <p class="first">This is first paragraph</p>
    <p class="second">This is second Paragraph</p>
    <p id="third">This is Third Paragraph</p>
    <pre class = "h">This is pre formatted tag</pre>
    <div id ="box">
    <p>This is paragraph tag inside div tag</p>
    </div>

</body>
</html>
